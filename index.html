<head>

<title>TNPSC Group I Mains PYQs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Mono', monospace, system-ui;
    background: #fff7ed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
  }
  h1 {

  }
  .cards {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.card {
    display: block;
    background: #fff;
    border: 2px solid #e7e5e4;

  .card-title {

  <div class="cards">
    <a class="card" href="output/viewer.html">

    </a>
    <a class="card" href="output/navigator.html">
